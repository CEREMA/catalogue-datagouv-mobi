[project]
name = "catalogue-mobi"
version = "0.1.0"
description = "Rattachement des jeux de données data.gouv.fr à une ontologie de la mobilité"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9.10,<3",
    "pgvector>=0.4.1,<0.5",
    "polars>=1.0.0",
    "python-dotenv>=1.1.1,<2",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.3.0",
    "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalogue_mobi"]
